# Charte graphique de l'administration burkinabè
# Publication d'une version : les deux paquets sur npm, la documentation
# en ligne. Les deux paquets sont @govbf/fasodesign, la charte, et
# @govbf/create-fasodesign, l'outil qui prépare un projet. Ils portent
# la même version et partent ensemble.
#
# Se déclenche sur une étiquette « v2.0.0 », jamais sur une branche.
# Rien n'est publié si la vérification échoue, et la version publiée est
# celle du package.json : l'étiquette doit correspondre, faute de quoi
# le travail s'arrête avant d'avoir rien envoyé.
#
# Avant la première exécution, trois choses à faire une fois :
#   1. enregistrer l'espace de noms @govbf sur le registre choisi ;
#   2. créer un jeton d'accès « Automation » et le ranger dans le secret
#      NPM_TOKEN du dépôt ;
#   3. activer Pages sur le dépôt, source « GitHub Actions ».

name: Publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Dépendances de l'application
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Vérification complète, contrôles de publication compris
        run: node outils/verifier.js --publication

      - name: L'étiquette correspond-elle à la version ?
        run: |
          version="$(node -p "require('./package.json').version")"
          etiquette="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$etiquette" ]; then
            echo "::error::étiquette $GITHUB_REF_NAME, package.json $version"
            exit 1
          fi
          echo "Version $version"

  # ------------------------------------------------------------------
  paquet:
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # dépôt de paquets de la forge
      id-token: write        # atteste l'origine du paquet

    # Le paquet part sur autant de dépôts que le projet en a déclarés.
    # Chaque étape est sautée si son jeton n'est pas configuré : on peut
    # donc n'en retenir qu'un, ou les trois, sans toucher au fichier.
    env:
      JETON_PUBLIC: ${{ secrets.NPM_TOKEN }}
      DEPOT_INTERNE: ${{ vars.REGISTRE_INTERNE }}
      JETON_INTERNE: ${{ secrets.REGISTRE_INTERNE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---------------------------------------------- registre public
      # --provenance relie publiquement le paquet au dépôt et au
      # travail qui l'a produit : quiconque installe la charte peut
      # vérifier qu'elle vient bien d'ici. C'est propre au registre
      # public, et cela n'a pas d'équivalent ailleurs.
      - name: Publier sur le registre public
        if: env.JETON_PUBLIC != ''
        run: npm publish --provenance --access public --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ------------------------------------------- dépôt de la forge
      # Gratuit, déjà authentifié, et lié au dépôt du code. L'espace de
      # noms doit porter le nom de l'organisation de la forge.
      - name: Publier sur le dépôt de la forge
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ------------------------------- dépôt de l'administration
      - name: Publier sur le dépôt de l'administration
        if: env.DEPOT_INTERNE != '' && env.JETON_INTERNE != ''
        run: npm publish --registry "$DEPOT_INTERNE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REGISTRE_INTERNE_TOKEN }}

  # ------------------------------------------------------------------
  # L'outil de préparation, @govbf/create-fasodesign, est ce que npm
  # exécute derrière « npm create @govbf/fasodesign@latest ». Il porte
  # la même version que la charte et part sur les mêmes dépôts, sans
  # quoi la commande installerait une version et en annoncerait une
  # autre.
  outil:
    needs: paquet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    defaults:
      run:
        working-directory: amorce

    env:
      JETON_PUBLIC: ${{ secrets.NPM_TOKEN }}
      DEPOT_INTERNE: ${{ vars.REGISTRE_INTERNE }}
      JETON_INTERNE: ${{ secrets.REGISTRE_INTERNE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publier sur le registre public
        if: env.JETON_PUBLIC != ''
        run: npm publish --provenance --access public --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publier sur le dépôt de la forge
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publier sur le dépôt de l'administration
        if: env.DEPOT_INTERNE != '' && env.JETON_INTERNE != ''
        run: npm publish --registry "$DEPOT_INTERNE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REGISTRE_INTERNE_TOKEN }}

  # ------------------------------------------------------------------
  documentation:
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Le même outil qu'en local. Le recopier ici à la main donnerait
      # un site sans la diffusion figée ni le .htaccess, et la
      # différence ne se verrait qu'une fois en ligne.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Les pages sont écrites par l'application Laravel ; le site
      # publié, lui, reste statique et n'a pas besoin de PHP.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Dépendances de l'application
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      - name: Construire le site
        env:
          FASO_SITE: site
        run: node outils/site.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
