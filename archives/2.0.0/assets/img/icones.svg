<?xml version='1.0' encoding='UTF-8'?>
<!-- Jeu d'icônes de la charte graphique de l'administration burkinabè.
     Grille 24 x 24, trait 1,5, extrémités arrondies.
     Fichier de référence pour les outils de conception et les
     intégrations qui préfèrent <use> au masque CSS. -->
<svg xmlns='http://www.w3.org/2000/svg' fill='none' stroke='currentColor'
     stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'>
  <symbol id='fs-recherche' viewBox='0 0 24 24'>
    <title>Recherche, loupe</title>
    <circle cx='11' cy='11' r='6.5'/><path d='M15.9 15.9 20.5 20.5'/>
  </symbol>
  <symbol id='fs-fermer' viewBox='0 0 24 24'>
