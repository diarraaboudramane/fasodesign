# Charte graphique de l'administration burkinabè
# Fragment de configuration nginx pour servir la charte en ligne.
#
# À inclure dans un bloc server. Les chemins sont à adapter ; tout le
# reste peut être repris tel quel.
#
# L'arborescence attendue sous /var/www/charte :
#
#   2.0.0/css/… 2.0.0/js/… 2.0.0/polices/… 2.0.0/img/…
#   2.1.0/…
#   index.html et les autres pages de la documentation
#
# Une version publiée ne se réécrit pas. Une correction sort sous un
# nouveau numéro : c'est ce qui autorise un cache d'un an, et c'est ce
# qui permet à un service de ne pas changer d'apparence du jour au
# lendemain sans l'avoir décidé.

root /var/www/charte;

# ------------------------------------------------------------ robots
# Le refus s'applique avant tout le reste : inutile de chercher un
# fichier sur le disque pour un agent qu'on ne veut pas servir.
#
# La carte des agents et les zones de debit sont dans le contexte
# « http », fournies par hebergement/faso-robots.conf.
# >>> robots : engendre par outils/robots.js refus
    # Refus des collecteurs declares. Le 403 est rendu sans lire le
    # disque, et le journal garde la trace de la tentative.
    if ($faso_collecteur) {
        return 403;
    }
    # <<< robots refus

# Le type des polices n'est pas toujours connu des installations
# anciennes ; sans lui, certains navigateurs refusent le fichier.
#
# Un bloc « types » remplace la table héritée du contexte http au lieu
# de s'y ajouter : seul, il ferait partir les pages, les feuilles de
# style et les scripts en application/octet-stream. La table complète
# est donc rechargée d'abord. Sur une installation récente, nginx -t
# signale un doublon pour woff2 : c'est sans conséquence.
include mime.types;
types {
    font/woff2  woff2;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript image/svg+xml application/json;

# Les woff2 sont déjà compressés : les repasser au gzip coûte du
# processeur et ne gagne rien.
gzip_proxied any;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# ------------------------------------------------- reserve de fouille
# Reservation des droits de fouille de textes et de donnees, au sens
# du protocole TDM du W3C. Sa portee est juridique, pas technique :
# elle ne bloque rien, elle etablit que la reprise n'a pas ete
# consentie. C'est ce qui manque a un robots.txt, qu'on peut toujours
# dire n'avoir pas vu.
#
# « noindex » n'y figure pas, et ne doit pas y figurer : le site doit
# rester trouvable par les moteurs de recherche.
add_header X-Robots-Tag "noai, noimageai" always;
add_header TDM-Reservation "1" always;

# ------------------------------------------------- diffusion versionnée
location ~ ^/(\d+\.\d+\.\d+)/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;

    # Un service hébergé sur un autre domaine consomme ces fichiers :
    # sans cet en-tête, la police est téléchargée puis rejetée.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    # add_header remplace le jeu herite du bloc server au lieu de s'y
    # ajouter : sans ces deux lignes, les fichiers de la charte, qui
    # sont le contenu qui a de la valeur, partiraient sans reserve.
    add_header X-Robots-Tag "noai, noimageai" always;
    add_header TDM-Reservation "1" always;

    try_files $uri =404;
}

# -------------------------------------------------- documentation
location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    # >>> robots : engendre par outils/robots.js pages
    # Le debit ne s'applique qu'ici, jamais a la diffusion versionnee :
    # les fichiers versionnes sont consommes par les navigateurs des
    # agents d'autres administrations, et les limiter par adresse
    # couperait un ministere entier derriere une sortie nattee.
    limit_req zone=faso_pages burst=30 nodelay;
    limit_conn faso_liens 24;
    # <<< robots pages
    try_files $uri $uri/ $uri.html =404;
}

# Le dossier des ressources Android n'a pas à être exploré.
location /android/ {
    autoindex off;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}

error_page 404 /404.html;
