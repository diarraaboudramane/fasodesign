# Charte graphique de l'administration burkinabè
# Fragment de configuration nginx pour servir la charte en ligne.
#
# À inclure dans un bloc server. Les chemins sont à adapter ; tout le
# reste peut être repris tel quel.
#
# L'arborescence attendue sous /var/www/charte :
#
#   2.0.0/css/… 2.0.0/js/… 2.0.0/polices/… 2.0.0/img/…
#   2.1.0/…
#   index.html et les autres pages de la documentation
#
# Une version publiée ne se réécrit pas. Une correction sort sous un
# nouveau numéro : c'est ce qui autorise un cache d'un an, et c'est ce
# qui permet à un service de ne pas changer d'apparence du jour au
# lendemain sans l'avoir décidé.

root /var/www/charte;

# Le type des polices n'est pas toujours connu des installations
# anciennes ; sans lui, certains navigateurs refusent le fichier.
types {
    font/woff2  woff2;
    image/svg+xml  svg;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript image/svg+xml application/json;

# Les woff2 sont déjà compressés : les repasser au gzip coûte du
# processeur et ne gagne rien.
gzip_proxied any;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# ------------------------------------------------- diffusion versionnée
location ~ ^/(\d+\.\d+\.\d+)/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;

    # Un service hébergé sur un autre domaine consomme ces fichiers :
    # sans cet en-tête, la police est téléchargée puis rejetée.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    try_files $uri =404;
}

# -------------------------------------------------- documentation
location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ $uri.html =404;
}

# Le dossier des ressources Android n'a pas à être exploré.
location /android/ {
    autoindex off;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}

error_page 404 /404.html;
