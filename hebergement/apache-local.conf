# Charte graphique de l'administration burkinabè
# Apache local, pour éprouver le site avant sa mise en ligne.
#
# Configuration autonome : elle ne modifie aucune installation
# existante et se lance à côté, sur son propre port.
#
#   httpd -f hebergement/apache-local.conf
#
# Puis http://localhost:8080/
#
# Ce qu'elle reproduit du futur hébergement :
#   — la lecture du .htaccess, donc les en-têtes réels ;
#   — les types MIME des polices et des SVG ;
#   — la compression ;
#   — la page d'erreur 404 de la charte ;
#   — la diffusion figée sous /2.0.0/ ;
#   — le refus des collecteurs declares.
#
# Ce qu'elle ne reproduit pas : le TLS et le nom de domaine.

# ------------------------------------------------------------ chemins
# À adapter si XAMPP n'est pas à cet endroit.
Define RACINE_APACHE "C:/xampp/apache"
# On sert le site construit, et non la racine du projet : c'est
# exactement l'arborescence qui partira sur chartegraphique.gov.bf.
# Il est produit hors du projet, pour ne pas y dupliquer chaque page.
#   node outils/site.js
Define RACINE_PROJET "C:/Users/1/Documents/IntellijIDEA/charte_graphique_burkina_v1"
Define RACINE_SITE   "C:/Users/1/AppData/Local/Temp/fasodesign-site"

ServerRoot "${RACINE_APACHE}"
ServerName localhost

# Le port peut etre pris par un autre service. Pour en changer sans
# toucher au fichier :
#   httpd -f hebergement/apache-local.conf -D AUTRE_PORT -C "Listen 8081"
<IfDefine !AUTRE_PORT>
Listen 8080
</IfDefine>

# ------------------------------------------------------------ modules
# Sous Windows, le gestionnaire de processus et mod_unixd sont
# integres au serveur : les charger echouerait.
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so

# mod_setenvif marque les collecteurs, mod_authz_core les refuse.
# Sans lui, le bloc <IfModule mod_setenvif.c> du .htaccess est saute
# en silence : le site repondrait a tout le monde, et l'epreuve ne
# vaudrait rien.
LoadModule setenvif_module modules/mod_setenvif.so

# Les trois que la charte emploie réellement.
LoadModule headers_module modules/mod_headers.so
LoadModule expires_module modules/mod_expires.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so

# ------------------------------------------------------------- types
TypesConfig conf/mime.types
AddType font/woff2 .woff2
AddType image/svg+xml .svg
AddType application/json .json

AddDefaultCharset UTF-8

# -------------------------------------------------------------- site
DocumentRoot "${RACINE_SITE}"

<Directory "${RACINE_SITE}">
    # AllowOverride All : le .htaccess est lu, comme il le sera sur
    # l'hébergement définitif. C'est tout l'intérêt de l'épreuve.
    AllowOverride All
    Require all granted
    Options -Indexes +FollowSymLinks
    DirectoryIndex index.html
</Directory>

# ------------------------------------------------------------ traces
ErrorLog "${RACINE_PROJET}/hebergement/journal-erreurs.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" commun
CustomLog "${RACINE_PROJET}/hebergement/journal-acces.log" commun

PidFile "${RACINE_PROJET}/hebergement/apache-local.pid"
