# Charte graphique de l'administration burkinabè
# Fragment de configuration nginx pour servir l'application Laravel de
# la documentation (et non le site exporté, que sert nginx.conf).
#
# À inclure dans un bloc server, avec hebergement/faso-robots.conf dans
# le contexte « http » : il définit $faso_collecteur et les zones de
# débit, sans lesquels nginx refuse de démarrer. Adapter trois chemins :
# la racine (public/ de l'application), la socket PHP-FPM, et le dossier
# de la diffusion versionnée.
#
# Les en-têtes de sécurité, la réserve de fouille, le cache et
# l'autorisation des polices sont posés par l'application
# (app/Http/Middleware/EnTetesDeSecurite.php et FichierController) :
# aucun add_header pour ce qui passe par PHP, il doublerait chaque
# en-tête. Seule la diffusion versionnée, servie ici sans PHP, porte les
# siens.

root /var/www/charte/current/public;
index index.php;
charset utf-8;

# ------------------------------------------------------------ robots
# >>> robots : engendre par outils/robots.js refus
    # Refus des collecteurs declares. Le 403 est rendu sans lire le
    # disque, et le journal garde la trace de la tentative.
    if ($faso_collecteur) {
        return 403;
    }
    # <<< robots refus

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/xml;

# ------------------------------------------------- diffusion versionnée
# Une version publiée ne se réécrit jamais et ne disparaît jamais : un
# service peut l'avoir écrite en dur. L'application ne sert que la
# version courante : pour garder les précédentes après une mise à jour,
# déposer chaque version publiée dans un dossier qui survit aux mises à
# jour (copie de assets/css, js, img et polices, sans docs.css ni
# docs.js), et nginx la sert de là, sans PHP. Une version absente du
# dossier passe à l'application.
#
# Sans limitation de débit : ces fichiers sont consommés par les
# navigateurs des agents d'autres administrations.
location ~ ^/\d+\.\d+\.\d+/ {
    root /var/www/charte/shared/diffusion;
    try_files $uri @application;

    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noai, noimageai" always;
    add_header TDM-Reservation "1" always;
}

# -------------------------------------------------- documentation
location / {
    # >>> robots : engendre par outils/robots.js pages
    # Le debit ne s'applique qu'ici, jamais a la diffusion versionnee :
    # les fichiers versionnes sont consommes par les navigateurs des
    # agents d'autres administrations, et les limiter par adresse
    # couperait un ministere entier derriere une sortie nattee.
    limit_req zone=faso_pages burst=30 nodelay;
    limit_conn faso_liens 24;
    # <<< robots pages
    try_files $uri /index.php?$query_string;
}

location @application {
    rewrite ^ /index.php last;
}

location = /index.php {
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    include fastcgi_params;

    # Le site public n'est servi qu'en https : soit le proxy amont termine
    # le TLS, soit certbot redirige le port 80. Sans ce paramètre,
    # l'application, qui reçoit du http, écrirait des liens en http et le
    # navigateur bloquerait les feuilles de styles d'une page https.
    fastcgi_param HTTPS on;

    fastcgi_hide_header X-Powered-By;
}

# Aucun autre script PHP n'est exécutable, et rien de caché n'est servi.
location ~ \.php$ {
    return 404;
}

location ~ /\.(?!well-known) {
    deny all;
}
